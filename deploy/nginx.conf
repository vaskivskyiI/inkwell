# nginx in front of Inkwell (TLS via certbot). Both WebSockets (/api/collab, /api/ws) need the Upgrade headers.
# Set INKWELL_PUBLIC_URL=https://notes.example.com and INKWELL_SECURE_COOKIES=1 in deploy/inkwell.env.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 443 ssl http2;
  server_name notes.example.com;
  # ssl_certificate / ssl_certificate_key: managed by certbot

  # Uploads and imports of any size: no cap, and stream them through instead of buffering on nginx's disk first.
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_send_timeout 1h;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;       # long-lived sockets
    proxy_buffering off;         # streamed AI answers
  }
}

server {
  listen 80;
  server_name notes.example.com;
  return 301 https://$host$request_uri;
}
